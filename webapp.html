  .bg-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,5,9,0.55) 0%, rgba(10,5,9,0.82) 40%, rgba(10,5,9,0.97) 100%);
    z-index: 1;
  }

  .content { position: relative; z-index: 2; }

  /* Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,5,9,0.85);
    backdrop-filter: blur(20px);
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-img {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid rgba(232,184,0,0.4);
  }

  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .cart-btn {
    position: relative;
    background: rgba(232,184,0,0.1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .cart-btn:active { transform: scale(0.95); }

  .cart-count {
    background: var(--accent2);
    color: white;
    font-size: 11px;
    font-weight: 700;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: none;
    align-items: center;
    justify-content: center;
  }

  /* Hero */
  .hero {
    padding: 28px 20px 20px;
    text-align: center;
  }

  .hero-logo {
    width: 110px;
    height: 110px;
    border-radius: 20px;
    object-fit: cover;
    border: 2px solid rgba(232,184,0,0.5);
    box-shadow: 0 0 40px rgba(232,184,0,0.2), 0 0 80px rgba(255,60,0,0.1);
    margin: 0 auto 16px;
    display: block;
  }

  .hero-tag {
    display: inline-block;
    background: rgba(232,184,0,0.12);
    border: 1px solid rgba(232,184,0,0.35);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 60%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero p { color: var(--text-muted); font-size: 14px; }

  /* Section titre */
  .section-title {
    padding: 16px 20px 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text-muted);
  }

  /* Grille produits */
  .products-grid {
    padding: 0 20px 100px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .product-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeUp 0.4s ease both;
    backdrop-filter: blur(10px);
  }

  .product-card:active { transform: scale(0.97); border-color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .product-img {
    width: 100%;
    aspect-ratio: 1;
    background: rgba(30,20,10,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
    overflow: hidden;
  }

  .product-img img { width: 100%; height: 100%; object-fit: cover; }

  .product-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }

  .product-info { padding: 11px; }
  .product-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; line-height: 1.3; }
  .product-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 9px; line-height: 1.4; }

  .product-footer { display: flex; align-items: center; justify-content: space-between; }

  .product-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .add-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: #000;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .add-btn:active { transform: scale(0.85); }

  /* Modal produit */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #100b06;
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 14px auto 0;
  }

  .modal-img {
    width: 100%; height: 260px;
    background: rgba(30,20,10,0.9);
    display: flex; align-items: center; justify-content: center;
    font-size: 80px; overflow: hidden;
  }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; }

  .modal-body { padding: 20px; }

  .modal-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px; letter-spacing: 1px; margin-bottom: 4px;
  }

  .modal-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px; color: var(--accent); margin-bottom: 10px;
  }

  .modal-desc { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 22px; }

  .qty-control { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .qty-label { font-size: 14px; font-weight: 500; color: var(--text-muted); }

  .qty-buttons {
    display: flex; align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }

  .qty-btn {
    background: none; border: none; color: var(--text);
    width: 44px; height: 44px; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s; font-family: 'DM Sans', sans-serif;
  }
  .qty-btn:active { background: rgba(232,184,0,0.1); }

  .qty-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; min-width: 36px; text-align: center;
  }

  .total-line {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-top: 1px solid var(--border); margin-bottom: 16px;
  }
  .total-label { font-size: 14px; color: var(--text-muted); }
  .total-value { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--accent); }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #000; padding: 16px; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.5px;
  }
  .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

  /* Panier */
  .cart-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 300; display: none; align-items: flex-end;
    backdrop-filter: blur(8px);
  }
  .cart-overlay.open { display: flex; }

  .cart-modal {
    background: #100b06;
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    width: 100%; max-height: 90vh;
    overflow-y: auto; animation: slideUp 0.3s ease;
    padding-bottom: 30px;
  }

  .cart-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
  }

  .cart-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; }

  .close-btn {
    background: rgba(232,184,0,0.08);
    border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 10px;
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  .cart-items { padding: 12px 20px; }

  .cart-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }

  .cart-item-img {
    width: 56px; height: 56px; border-radius: 10px;
    background: var(--card); display: flex; align-items: center;
    justify-content: center; font-size: 24px; flex-shrink: 0; overflow: hidden;
    border: 1px solid var(--border);
  }
  .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }

  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .cart-item-price { font-size: 13px; color: var(--accent); font-weight: 500; }

  .cart-item-remove {
    background: rgba(255,60,0,0.1); border: none; color: var(--accent2);
    width: 32px; height: 32px; border-radius: 8px; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  .cart-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .cart-empty-icon { font-size: 48px; margin-bottom: 12px; }

  .cart-footer {
    padding: 16px 20px 0; border-top: 1px solid var(--border);
  }

  .cart-total {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }

  .form-section { margin-bottom: 16px; }

  .form-label {
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 8px; display: block;
  }

  .form-input {
    width: 100%; background: rgba(30,20,10,0.8);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; color: var(--text); font-size: 15px;
    font-family: 'DM Sans', sans-serif; outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }

  .promo-row { display: flex; gap: 10px; }
  .promo-row .form-input { flex: 1; }

  .btn-secondary {
    background: rgba(232,184,0,0.08);
    border: 1px solid var(--border); color: var(--text);
    padding: 14px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    white-space: nowrap; font-family: 'DM Sans', sans-serif;
  }

  .promo-success {
    background: rgba(0,208,132,0.1); border: 1px solid rgba(0,208,132,0.3);
    color: var(--success); padding: 10px 14px; border-radius: 10px;
    font-size: 13px; margin-top: 8px; display: none;
  }

  .success-screen {
    display: none; flex-direction: column; align-items: center;
    justify-content: center; min-height: 80vh; padding: 40px 20px; text-align: center;
  }

  .success-icon {
    width: 90px; height: 90px;
    background: rgba(0,208,132,0.12); border: 2px solid rgba(0,208,132,0.3);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 40px; margin-bottom: 24px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,208,132,0.3); }
    50% { box-shadow: 0 0 0 20px rgba(0,208,132,0); }
  }

  .success-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px; letter-spacing: 2px; margin-bottom: 12px;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .success-msg { color: var(--text-muted); font-size: 15px; line-height: 1.6; max-width: 280px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1/-1; }
  .empty-state-icon { font-size: 56px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
</style>

          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>
      <div class="total-line">
        <span class="total-label">Total</span>
        <span class="total-value" id="modalTotal">0€</span>
      </div>
      <button class="btn-primary" onclick="addToCart()">🛒 Ajouter au panier</button>
    </div>
  </div>
</div>

<!-- Panier -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCartOverlay(event)">
  <div class="cart-modal">
    <div class="modal-handle"></div>
    <div class="cart-header">
      <div class="cart-title">🛒 Mon Panier</div>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-total">
        <span style="font-size:15px;font-weight:500">Total</span>
        <span style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent)" id="cartTotal">0€</span>
      </div>
      <div style="height:14px"></div>
      <div class="form-section">
        <label class="form-label">📍 Adresse de livraison</label>
        <input class="form-input" id="inputAdresse" placeholder="Ex: 12 rue de la Paix, Lyon" type="text">
      </div>
      <div class="form-section">
        <label class="form-label">📱 Numéro de téléphone</label>
        <input class="form-input" id="inputTel" placeholder="Ex: 06 12 34 56 78" type="tel">
      </div>
      <div class="form-section">
        <label class="form-label">🎟️ Code promo (optionnel)</label>
        <div class="promo-row">
          <input class="form-input" id="inputPromo" placeholder="Ex: BIENVENUE">
          <button class="btn-secondary" onclick="appliquerPromo()">OK</button>
        </div>
        <div class="promo-success" id="promoSuccess"></div>
      </div>
      <button class="btn-primary" onclick="passerCommande()">✅ Confirmer la commande</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0509'); }

let produits = [];
let cart = [];
let currentProduct = null;
let currentQty = 1;
let remise = 0;
let promos = {};

function loadProduits() {
  const params = new URLSearchParams(window.location.search);
  const data = params.get('products');
  const promosData = params.get('promos');
  
  if (promosData) {
    try { promos = JSON.parse(decodeURIComponent(promosData)); } catch(e) {}
  }
  
  if (data) {
    try { produits = JSON.parse(decodeURIComponent(data)); } catch(e) {}
  }

  if (!produits || !produits.length) {
    produits = [];
  }
  renderProduits();
}

function renderProduits() {
  const grid = document.getElementById('productsGrid');
  if (!produits.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">📦</div>
      <h3>Aucun produit</h3>
      <p>Les produits seront bientôt disponibles</p>
    </div>`;
    return;
  }
  grid.innerHTML = produits.map((p, i) => {
    // Prix affiché dans la grille
    let prixAffiche = '';
    if (p.variantes && p.variantes.length > 0) {
      prixAffiche = `À partir de ${p.variantes[0].prix}`;
    } else {
      prixAffiche = p.prix || '';
    }
    return `
    <div class="product-card" style="animation-delay:${i*0.08}s" onclick="openProduct(${i})">
      <div class="product-img">
        ${p.photo ? `<img src="${p.photo}" alt="${p.nom}" onerror="this.style.display='none'">` : '📦'}
        ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
      </div>
      <div class="product-info">
        <div class="product-name">${p.nom}</div>
        <div class="product-desc">${p.desc}</div>
        <div class="product-footer">
          <div class="product-price" style="font-size:14px">${prixAffiche}</div>
          <button class="add-btn" onclick="event.stopPropagation();quickAdd(${i})">+</button>
        </div>
      </div>
    </div>
  `}).join('');
}

function openProduct(i) {
  currentProduct = i; currentQty = 1;
  window.selectedVariante = 0;
  const p = produits[i];
  document.getElementById('modalName').textContent = p.nom;
  document.getElementById('modalDesc').textContent = p.desc;
  const imgEl = document.getElementById('modalImg');
  imgEl.innerHTML = p.photo ? `<img src="${p.photo}" alt="${p.nom}">` : '📦';

  const variantesContainer = document.getElementById('variantesContainer');
  const variantesList = document.getElementById('variantesList');
  const qtyControl = document.getElementById('qtyControl');
  const modalPrice = document.getElementById('modalPrice');

  if (p.variantes && p.variantes.length > 0) {
    variantesContainer.style.display = 'block';
    qtyControl.style.display = 'flex';
    modalPrice.textContent = '';
    variantesList.innerHTML = p.variantes.map((v, vi) => `
      <div onclick="selectVariante(${vi})" id="variante_${vi}" style="
        background:var(--card);border:2px solid ${vi===0?'var(--accent)':'var(--border)'};
        border-radius:12px;padding:14px 16px;cursor:pointer;
        display:flex;justify-content:space-between;align-items:center;transition:all 0.2s;
      ">
        <span style="font-weight:600;font-size:15px">${v.quantite}</span>
        <span style="color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:22px">${v.prix}</span>
      </div>
    `).join('');
    document.getElementById('modalTotal').textContent = p.variantes[0].prix + ' x1';
    document.getElementById('qtyValue').textContent = 1;
  } else {
    variantesContainer.style.display = 'none';
    qtyControl.style.display = 'flex';
    modalPrice.textContent = p.prix || '';
    document.getElementById('qtyValue').textContent = 1;
    document.getElementById('modalTotal').textContent = p.prix || '';
  }

  document.getElementById('productModal').classList.add('open');
}

function selectVariante(vi) {
  const p = produits[currentProduct];
  window.selectedVariante = vi;
  p.variantes.forEach((v, idx) => {
    const el = document.getElementById(`variante_${idx}`);
    if (el) el.style.borderColor = idx === vi ? 'var(--accent)' : 'var(--border)';
  });
  const qty = parseInt(document.getElementById('qtyValue').textContent) || 1;
  document.getElementById('modalTotal').textContent = p.variantes[vi].prix + ' x' + qty;
}

function changeQty(delta) {
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById('qtyValue').textContent = currentQty;
  const p = produits[currentProduct];
  if (p.variantes && p.variantes.length > 0) {
    const v = p.variantes[window.selectedVariante || 0];
    document.getElementById('modalTotal').textContent = v.prix + ' x' + currentQty;
  } else {
    document.getElementById('modalTotal').textContent = `${p.prix} x${currentQty}`;
  }
}

function addToCart() {
  const p = produits[currentProduct];
  let nomPanier, prixPanier;

  if (p.variantes && p.variantes.length > 0) {
    const v = p.variantes[window.selectedVariante || 0];
    nomPanier = `${p.nom} — ${v.quantite}`;
    prixPanier = v.prix;
  } else {
    nomPanier = p.nom;
    prixPanier = p.prix;
  }

  const key = `${currentProduct}_${window.selectedVariante}`;
  const ex = cart.find(c => c.key === key);
  if (ex) ex.qty += currentQty;
  else cart.push({ key, id: currentProduct, nom: nomPanier, prix: prixPanier, photo: p.photo, qty: currentQty });

  updateCartCount();
  document.getElementById('productModal').classList.remove('open');
  if (tg) tg.HapticFeedback?.impactOccurred('light');
}

function quickAdd(i) {
  const p = produits[i];
  if (p.variantes && p.variantes.length > 0) {
    openProduct(i); return;
  }
  const key = `${i}_null`;
  const ex = cart.find(c => c.key === key);
  if (ex) ex.qty++;
  else cart.push({ key, id: i, nom: p.nom, prix: p.prix, photo: p.photo, qty: 1 });
  updateCartCount();
  if (tg) tg.HapticFeedback?.impactOccurred('light');
}

function updateCartCount() {
  const total = cart.reduce((s,c) => s+c.qty, 0);
  const el = document.getElementById('cartCount');
  el.textContent = total;
  el.style.display = total > 0 ? 'flex' : 'none';
}

function openCart() { renderCart(); document.getElementById('cartOverlay').classList.add('open'); }
function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); }
function closeCartOverlay(e) { if (e.target === document.getElementById('cartOverlay')) closeCart(); }

function renderCart() {
  const itemsEl = document.getElementById('cartItems');
  const footerEl = document.getElementById('cartFooter');
  if (!cart.length) {
    itemsEl.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">🛒</div><p>Ton panier est vide</p></div>`;
    footerEl.style.display = 'none'; return;
  }
  itemsEl.innerHTML = cart.map((item,i) => `
    <div class="cart-item">
      <div class="cart-item-img">${item.photo ? `<img src="${item.photo}" alt="${item.nom}">` : '📦'}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.nom}</div>
        <div class="cart-item-price">${item.prix} x${item.qty}</div>
      </div>
      <button class="cart-item-remove" onclick="removeFromCart(${i})">✕</button>
    </div>
  `).join('');
  // Extraire les chiffres du prix pour calculer le total
  function extractPrix(p) {
    if (typeof p === 'number') return p;
    const match = String(p).match(/(\d+)/);
    return match ? parseInt(match[1]) : 0;
  }
  const total = cart.reduce((s,c) => s + extractPrix(c.prix) * c.qty, 0);
  const totalApres = remise ? Math.round(total*(1-remise/100)) : total;
  document.getElementById('cartTotal').textContent = totalApres + '€';
  footerEl.style.display = 'block';
}

function removeFromCart(i) { cart.splice(i,1); updateCartCount(); renderCart(); }

function appliquerPromo() {
  const code = document.getElementById('inputPromo').value.trim().toUpperCase();
  const el = document.getElementById('promoSuccess');
  if (promos[code]) {
    remise = promos[code];
    el.textContent = `✅ Code "${code}" appliqué ! -${remise}%`;
    el.style.display = 'block'; renderCart();
  } else {
    el.textContent = '❌ Code invalide'; el.style.display = 'block'; remise = 0;
  }
}

function passerCommande() {
  const adresse = document.getElementById('inputAdresse').value.trim();
  const tel = document.getElementById('inputTel').value.trim();
  if (!adresse) { alert('📍 Entre ton adresse de livraison'); return; }
  if (!tel) { alert('📱 Entre ton numéro de téléphone'); return; }
  if (!cart.length) { alert('🛒 Ton panier est vide'); return; }

  function extractPrix(p) {
    if (typeof p === 'number') return p;
    const match = String(p).match(/(\d+)/);
    return match ? parseInt(match[1]) : 0;
  }

  const total = cart.reduce((s,c) => s + extractPrix(c.prix) * c.qty, 0);
  const totalApres = remise ? Math.round(total*(1-remise/100)) : total;

  const orderData = {
    items: cart.map(c => ({ nom: c.nom, qty: c.qty, prix: c.prix })),
    total: totalApres, remise, adresse, telephone: tel
  };
  if (tg) tg.sendData(JSON.stringify(orderData));
  closeCart();
  showSuccess(totalApres, cart, adresse, tel);
}

function showSuccess(total, items, adresse, tel) {
  document.querySelector('.header').style.display = 'none';
  document.querySelector('.hero').style.display = 'none';
  document.querySelector('.section-title').style.display = 'none';
  document.getElementById('productsGrid').style.display = 'none';
  const recap = items.map(c => `• ${c.nom} x${c.qty} — ${c.prix}`).join('<br>');
  const el = document.createElement('div');
  el.className = 'success-screen';
  el.style.display = 'flex';
  el.innerHTML = `
    <div class="success-icon">✅</div>
    <div class="success-title">Commande Envoyée !</div>
    <div style="background:rgba(255,255,255,0.05);border-radius:14px;padding:16px;margin:16px 0;text-align:left;width:100%;max-width:320px">
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase">Récapitulatif</p>
      <p style="font-size:14px;line-height:1.8">${recap}</p>
      <hr style="border-color:rgba(255,255,255,0.1);margin:12px 0">
      <p style="font-size:13px">📍 ${adresse}</p>
      <p style="font-size:13px">📱 ${tel}</p>
      <p style="font-size:13px;margin-top:8px;color:var(--accent);font-weight:600">💵 Paiement en espèces à la livraison</p>
    </div>
    <p class="success-msg">Tu vas être contacté rapidement pour la livraison. 🚀</p>
  `;
  document.querySelector('.content').appendChild(el);
}

loadProduits();
</script>
</body>
</html>
